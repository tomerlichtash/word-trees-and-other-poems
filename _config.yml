title: Word Trees
subtitle: and Other Poems
description: A free web book of interactive visual poetry

bookserial: 3-14159265359
page_count: 9

license:
  symbol: cc
  description: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International License
  url: http://creativecommons.org/licenses/by-nc-sa/4.0/

author:
  name: Tomer Lichtash
  description: Writer / Developer
  location: Tel-Aviv, Israel
  url: http://tomerlichtash.com/

socialmedia:
  twitter: tomerlichtash
  facebook: tomerlichtash

# Config
source: .
destination: docs

url: 'https://tomerlichtash.github.io'
baseurl: '/word-trees-and-other-poems'

permalink: /:title/

markdown: kramdown
highlight: rouge
excerpt_separator: "<!--more-->"

# Options: http://jch.penibelst.de
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  profile: false
  ignore:
    envs: [development]

sass:
  style: compressed
  quiet_deps: true
  silence_deprecations: [import, slash-div, global-builtin, color-functions]
  sourcemap: never


exclude:
    - .bundle
    - .sass-cache
    - Gemfile
    - Gemfile.lock
    - package.json
    - assets/scss
    - assets/xslt
    - node_modules
    - vendor
    - README.md
    - LICENCE.md
    - package-lock.json
    - npm-debug.log


